<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#07090A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · Oleksandr Vyshnevskyi </title>
  <meta name="robots" content="noindex, nofollow">

  
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">

  
  <link rel="preload" href="fonts/syne-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/buttons.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--t);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    ::selection { background: var(--g); color: var(--g-btn); }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--g); border-radius: var(--r-xs); }

    :focus-visible {
      outline: 2px solid var(--g);
      outline-offset: 4px;
      border-radius: var(--r-sm);
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp-24) clamp(1.5rem, 5vw, 5rem);
      border-bottom: 1px solid var(--ga-10);
      background: rgba(var(--bg-rgb),.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--g);
      text-decoration: none;
      letter-spacing: var(--ls-heading);
    }

    .nav-links {
      display: flex;
      gap: var(--sp-32);
      list-style: none;
    }

    .nav-links a {
      color: var(--m);
      text-decoration: none;
      font-size: var(--fs-body-sm);
      transition: color var(--dur-fast);
    }

    .nav-links a:hover { color: var(--t); }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-128) clamp(1.5rem, 5vw, 5rem) var(--sp-64);
      position: relative;
      overflow: hidden;
    }

    /* Glow background */
    main::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, var(--ga-08) 0%, transparent 70%);
      pointer-events: none;
    }

    .content {
      text-align: center;
      max-width: 560px;
      position: relative;
    }

    .err-num {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(7rem, 20vw, 12rem);
      line-height: var(--lh-heading);
      color: transparent;
      -webkit-text-stroke: 1px var(--ga-20);
      letter-spacing: var(--ls-display);
      user-select: none;
      margin-bottom: var(--sp-8);
    }

    .stag {
      font-size: var(--fs-small);
      font-weight: 400;
      letter-spacing: var(--ls-label);
      text-transform: uppercase;
      color: var(--g);
      margin-bottom: var(--sp-16);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: var(--fs-h2);
      color: var(--t-bright);
      line-height: var(--lh-heading);
      margin-bottom: var(--sp-16);
    }

    .sub {
      font-size: var(--fs-body-sm);
      color: var(--m);
      line-height: var(--lh-body);
      margin-bottom: var(--sp-48);
    }

    .actions {
      display: flex;
      gap: var(--sp-16);
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── FOOTER ── */
    footer {
      padding: var(--sp-24) clamp(1.5rem, 5vw, 5rem);
      border-top: 1px solid var(--ga-10);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-16);
      flex-wrap: wrap;
    }

    .foot-copy {
      font-size: var(--fs-small);
      color: var(--m);
    }

    .foot-links {
      display: flex;
      gap: var(--sp-24);
    }

    .foot-links a {
      font-size: var(--fs-small);
      color: var(--m);
      text-decoration: none;
      transition: color var(--dur-fast);
    }

    .foot-links a:hover { color: var(--g); }

    @media (max-width: 480px) {
      .nav-links { display: none; }
      footer { justify-content: center; text-align: center; }
      .foot-links { justify-content: center; }
    }
  </style>
</head>

<body>

  <nav>
    <a class="logo" href="/">OV.</a>
    <ul class="nav-links">
      <li><a href="/#about">About</a></li>
      <li><a href="/#skills">Skills</a></li>
      <li><a href="/projects">Projects</a></li>
      <li><a href="/#contact">Contact</a></li>
    </ul>
  </nav>

  <main>
    <div class="content">
      <div class="err-num">404</div>
      <div class="stag">Page not found</div>
      <h1>Looks like this page<br>doesn't exist.</h1>
      <p class="sub">The page you're looking for may have been moved,<br>deleted, or never existed in the first place.</p>
      <div class="actions">
        <a href="/" class="btn btn--primary btn--icon-left"><span class="btn__icon btn__icon--left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span> Back to Home</a>
        <a href="/projects" class="btn btn--secondary">View Projects <span class="btn__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
      </div>
    </div>
  </main>

  <footer>
    <span class="foot-copy">© <script>document.write(new Date().getFullYear())</script> Oleksandr Vyshnevskyi</span>
    <div class="foot-links">
      <a href="https://www.fiverr.com/vyshnevsky" target="_blank" rel="noopener">Fiverr</a>
      <a href="https://www.upwork.com/freelancers/~01569a3bc56c0a5504" target="_blank" rel="noopener">UpWork</a>
      <a href="https://www.linkedin.com/in/oleksandr-vyshnevskyi-dev/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </footer>

</body>
</html>
